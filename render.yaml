services:
  - type: web
    name: mos-1-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MOSS_ACCESS_TOKEN
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
